[project]
name = "jobmatch"
version = "0.1.0"
description = "Ranks job postings by fit with your résumé and explains each score."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "typer>=0.27.3",
]

[project.scripts]
jobmatch = "jobmatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", # pycodestyle + pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "N",           # pep8-naming
    "SIM",         # simplify
    "C4",          # comprehensions
    "RET",         # return
    "PTH",         # pathlib over os.path
    "LOG", "G",    # logging best practices
    "PT",          # pytest style
    "S",           # bandit (security)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=jobmatch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["jobmatch"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
